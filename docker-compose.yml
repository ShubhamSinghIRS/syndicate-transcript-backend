services:
  postgres:
    image: postgres:16-alpine
    container_name: syndicate-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - /mnt/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose - only the backend container can
    # reach it, over the internal compose network. Uncomment to allow access
    # from your own machine (e.g. via an SSH tunnel) for debugging with a
    # DB client:
    # ports:
    #   - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    networks:
      - backend

  backend:
    build:
      context: .
      args:
        CACHEBUST: ${CACHEBUST:-0}
    container_name: syndicate-backend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only - the internet can never reach this port directly.
    # Host Nginx proxies to it and is the only public listener (port 443).
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - backend

networks:
  backend: